name: Publish Release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - uses: HappyOnigiri/ShareSettings/actions/publish-release@main
        with:
          branch: ${{ github.event.pull_request.head.ref }}
          pr-body: ${{ github.event.pull_request.body }}
          github-token: ${{ secrets.GH_TOKEN }}

  attach-app:
    needs: publish
    runs-on: macos-15
    env:
      XCODE_VERSION: "26.3"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Resolve release tag
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          tag_name="${RELEASE_BRANCH#release/}"
          if [[ ! "$tag_name" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: ${tag_name}"
            exit 1
          fi
          echo "TAG_NAME=${tag_name}" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: |
          xcode_path="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$xcode_path" ]]; then
            echo "::error::Xcode ${XCODE_VERSION} is not installed at ${xcode_path}"
            exit 1
          fi
          sudo xcode-select --switch "$xcode_path"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build universal release app
        run: |
          xcodegen generate
          xcodebuild build \
            -project TimeTracker.xcodeproj \
            -scheme TimeTracker \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath release-build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify and package app
        run: |
          app_path="release-build/Build/Products/Release/TimeTracker.app"
          executable_path="${app_path}/Contents/MacOS/TimeTracker"
          expected_version="${TAG_NAME#v}"
          actual_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app_path}/Contents/Info.plist")"

          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "::error::App version ${actual_version} does not match release ${expected_version}"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          lipo "$executable_path" -verify_arch arm64 x86_64

          mkdir -p release-assets
          archive_name="TimeTracker-${TAG_NAME}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "release-assets/${archive_name}"
          (
            cd release-assets
            shasum -a 256 "$archive_name" > "${archive_name}.sha256"
          )

      - name: Attach app to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG_NAME" \
            "release-assets/TimeTracker-${TAG_NAME}.zip" \
            "release-assets/TimeTracker-${TAG_NAME}.zip.sha256" \
            --clobber
